name: Monthly Strategic Source Audit

on:
  schedule:
    # 1st of every month at 06:00 UTC
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      company_id:
        description: 'Optional Company ID to target (leave blank for all)'
        required: false
        type: string
      fail_for_test:
        description: 'Force failure to verify job_logs error capturing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  run-monthly-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore SQLite Database from Data Branch (if using local SQLite)
        if: env.DATABASE_URL == '' || startsWith(env.DATABASE_URL, 'sqlite')
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data; then
            echo "Fetching data branch for persistent SQLite database..."
            git fetch origin data:data
            git checkout data -- data/signal_stack.db || true
          else
            echo "Data branch does not exist yet; initializing fresh DB."
            python -m app.core.db init
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Execute Monthly Source Portfolio Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///./data/signal_stack.db' }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.company_id }}" ]; then
            ARGS="$ARGS --company-id ${{ inputs.company_id }}"
          fi
          if [ "${{ inputs.fail_for_test }}" = "true" ]; then
            ARGS="$ARGS --fail-for-test"
          fi
          python -m scripts.run_monthly_audit $ARGS

      - name: Persist SQLite Database to Data Branch
        if: (env.DATABASE_URL == '' || startsWith(env.DATABASE_URL, 'sqlite')) && always()
        run: |
          if [ -f "data/signal_stack.db" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            git branch -D data 2>/dev/null || true
            git checkout -b data
            git add -f data/signal_stack.db
            git commit -m "chore(data): automated monthly source audit sync [skip ci]" || echo "No DB changes to commit"
            git push origin data --force || echo "Push to data branch skipped or failed"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
